version: '3.8'

services:
  pcap-analyzer:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Mount for uploaded PCAP files persistence
      - ./uploads:/app/uploads
      # Mount for any extracted files
      - ./extracted:/app/extracted
      # Mount sample PCAP files
      - ./sample_pcaps:/app/sample_pcaps
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pcap-network

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pcap-analyzer
    restart: unless-stopped
    networks:
      - pcap-network
    profiles:
      - production

  # Optional: Add a file storage service for large PCAP files
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - pcap-network
    profiles:
      - storage

volumes:
  minio_data:
    driver: local

networks:
  pcap-network:
    driver: bridge